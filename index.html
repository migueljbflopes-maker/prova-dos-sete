<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="robots" content="noindex, nofollow">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Prova dos 7">
<title>A Prova dos Sete</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  /* Plano: linguagem iOS. Fundo agrupado, cartões de cantos largos, tipo de sistema com títulos
     grandes e apertados, um acento por fase. Acompanha o tema claro ou escuro de quem vê. */
  color-scheme:light;
  --bg:#f2f2f7; --card:#ffffff; --fill:rgba(118,118,128,.12); --sep:rgba(60,60,67,.17);
  --ink:#000000; --ink2:rgba(60,60,67,.76); --ink3:rgba(60,60,67,.34);
  --p0:#0071e3; --p0on:#ffffff; --p1:#d9500a; --p1on:#ffffff; --p2:#8e44d6; --p2on:#ffffff; --p3:#0071e3; --p3on:#ffffff;
  --accent:var(--p0); --on-accent:var(--p0on);
  --ok:#1d8a3b; --on-ok:#ffffff; --bad:#d70015; --on-bad:#ffffff; --flame:#ff9500;
  --pc:#ffffff; --pc-ink:#1c1c1e; --pc-red:#d70015; --pc-sh:0 0 0 .5px rgba(0,0,0,.16),0 2px 6px rgba(0,0,0,.13);
  --gloss:rgba(255,255,255,.55); --scrim:rgba(0,0,0,.38); --lift:0 1px 3px rgba(0,0,0,.14);
  --c0:#ff3b30; --c1:#ffcc00; --c2:#34c759; --c3:#007aff; --c4:#af52de; --c5:#8e8e93;
  --g1:#ff9500; --g2:#ff2d55; --g3:#af52de;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter",system-ui,"Segoe UI",Roboto,sans-serif;
  --round:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,"Inter",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#000000; --card:#1c1c1e; --fill:rgba(118,118,128,.26); --sep:rgba(84,84,88,.62);
    --ink:#ffffff; --ink2:rgba(235,235,245,.7); --ink3:rgba(235,235,245,.3);
    --p0:#0a84ff; --p1:#ff9f0a; --p1on:#2b1700; --p2:#bf5af2; --p2on:#21063a; --p3:#0a84ff;
    --ok:#30d158; --on-ok:#00230c; --bad:#ff453a; --on-bad:#2a0300; --flame:#ff9f0a;
    --pc:#f2f2f7; --pc-sh:0 0 0 .5px rgba(0,0,0,.4),0 2px 6px rgba(0,0,0,.5);
    --c0:#ff453a; --c1:#ffd60a; --c2:#30d158; --c3:#0a84ff; --c4:#bf5af2; --c5:#98989d;
    --g1:#ff9f0a; --g2:#ff375f; --g3:#bf5af2;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#000000; --card:#1c1c1e; --fill:rgba(118,118,128,.26); --sep:rgba(84,84,88,.62);
  --ink:#ffffff; --ink2:rgba(235,235,245,.7); --ink3:rgba(235,235,245,.3);
  --p0:#0a84ff; --p1:#ff9f0a; --p1on:#2b1700; --p2:#bf5af2; --p2on:#21063a; --p3:#0a84ff;
  --ok:#30d158; --on-ok:#00230c; --bad:#ff453a; --on-bad:#2a0300; --flame:#ff9f0a;
  --pc:#f2f2f7; --pc-sh:0 0 0 .5px rgba(0,0,0,.4),0 2px 6px rgba(0,0,0,.5);
  --c0:#ff453a; --c1:#ffd60a; --c2:#30d158; --c3:#0a84ff; --c4:#bf5af2; --c5:#98989d;
  --g1:#ff9f0a; --g2:#ff375f; --g3:#bf5af2;
}
:root[data-fase="1"]{--accent:var(--p1);--on-accent:var(--p1on)}
:root[data-fase="2"]{--accent:var(--p2);--on-accent:var(--p2on)}
:root[data-fase="3"]{--accent:var(--p3);--on-accent:var(--p3on)}

*{box-sizing:border-box}
html{height:100%;background:var(--bg)}
body{margin:0;min-height:100%;display:flex;flex-direction:column;background:var(--bg);color:var(--ink);font:400 17px/1.42 var(--sans);letter-spacing:-.012em;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
#app{flex:1;width:100%;max-width:480px;margin:0 auto;padding:0 20px 28px;display:flex;flex-direction:column;gap:16px}
#app>.tag:first-child{margin-top:30px}
button,input{font:inherit;letter-spacing:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 55%,transparent);outline-offset:2px}
p,h1,h2,ol,ul{margin:0}
ol,ul{padding:0;list-style:none}
strong{font-weight:600}

/* Barra de navegação */
.bar{position:sticky;top:0;z-index:5;margin:0 -20px;padding:8px 20px 10px;display:grid;gap:8px;background:var(--bg);background:color-mix(in srgb,var(--bg) 76%,transparent);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);box-shadow:0 .5px 0 var(--sep)}
.bar-row{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:34px}
.navb{display:inline-flex;align-items:center;gap:5px;background:none;border:0;padding:6px 6px 6px 0;color:var(--accent);font-size:16px;font-weight:500}
.navb svg{flex:none}
.navb.menu{background:var(--fill);border-radius:999px;padding:6px 11px;color:var(--ink);font:600 14px/1 var(--round);font-variant-numeric:tabular-nums}
.bar-right{display:flex;align-items:center;gap:12px}
.torches{display:flex;gap:3px}
.torch{width:15px;height:17px;fill:var(--flame)}
.torch.off{fill:var(--ink3)}
.clock{font:600 16px/1 var(--round);font-variant-numeric:tabular-nums;color:var(--accent);background:color-mix(in srgb,var(--accent) 13%,transparent);padding:6px 10px;border-radius:999px}
.clock.big{font-size:40px;font-weight:700;background:none;padding:0;letter-spacing:-.02em}
.clock.over{color:var(--bad)}
.track{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.track i{height:4px;border-radius:2px;background:var(--fill)}
.track i.done{background:var(--accent)}
.track i.now{background:var(--ink3)}

/* Tipografia */
.tag{align-self:flex-start;display:inline-flex;font-size:13px;font-weight:600;letter-spacing:.02em;text-transform:uppercase;color:var(--accent);background:color-mix(in srgb,var(--accent) 13%,transparent);padding:5px 11px;border-radius:999px;margin-top:6px}
.tag.bad{color:var(--bad);background:color-mix(in srgb,var(--bad) 13%,transparent)}
.title{font-size:clamp(32px,9.2vw,40px);line-height:1.08;font-weight:700;letter-spacing:-.03em;text-wrap:balance}
.title.role{font-size:clamp(56px,17vw,76px);letter-spacing:-.045em}
.title.ok{color:var(--ok)} .title.bad{color:var(--bad)}
.lead{max-width:34em}
.muted{color:var(--ink2)} .small{font-size:15px}
.eyebrow{font-size:13px;font-weight:600;letter-spacing:.03em;text-transform:uppercase;color:var(--ink2)}
.sec{font-size:22px;font-weight:700;letter-spacing:-.022em;margin-top:10px}
.lbl{font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--ink2)}
.num-s{flex:none;display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent);font:700 13px/1 var(--round);font-variant-numeric:tabular-nums}
.grad{color:var(--g2);background:linear-gradient(110deg,var(--g1),var(--g2) 52%,var(--g3));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}

/* Listas agrupadas */
.rules,.group,.fases,.etapas,.mix{background:var(--card);border-radius:16px;overflow:hidden}
.rules{counter-reset:r}
.rules li{counter-increment:r;position:relative;display:grid;grid-template-columns:24px 1fr;gap:12px;align-items:start;padding:13px 16px}
.rules li::before{content:counter(r);display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent);font:700 13px/1 var(--round)}
.rules li+li::after,.group>li+li::after,.fases li+li::after,.etapa+.etapa::after,.mix li+li::after{content:"";position:absolute;top:0;left:52px;right:0;height:.5px;background:var(--sep)}
.group>li{position:relative}
.group>li+li::after{left:16px}
.host{background:var(--fill);border-radius:14px;padding:11px 14px 12px;display:grid;gap:3px;font-size:15px;line-height:1.38}

/* Botões */
.actions{display:grid;gap:10px;margin-top:auto;padding-top:10px}
.btn{display:block;width:100%;min-height:52px;border:0;border-radius:14px;background:var(--accent);color:var(--on-accent);font-size:17px;font-weight:600;padding:14px 18px;text-align:center;transition:transform .12s,opacity .12s}
.btn.alt{background:var(--fill);color:var(--accent)}
.btn.small{min-height:46px;font-size:16px;padding:11px 14px}
.btn.ok{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.btn.bad{background:color-mix(in srgb,var(--bad) 13%,transparent);color:var(--bad)}
.btn:disabled{opacity:.38;cursor:not-allowed}
.btn:active:not(:disabled){transform:scale(.975);opacity:.85}
.row{display:flex;gap:10px} .row>*{flex:1;min-width:0}
.link{background:none;border:0;align-self:center;color:var(--accent);padding:10px 8px;font-size:15px}
.mini{min-width:78px;min-height:40px;border:0;border-radius:999px;background:var(--fill);font-weight:600;font-size:14px;padding:8px 12px}
.mini.on.ok{background:var(--ok);color:var(--on-ok)}
.mini.on.bad{background:var(--bad);color:var(--on-bad)}
.fb{padding:11px 14px;border-radius:12px;font-weight:600;font-size:15px}
.fb.ok{color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,transparent)}
.fb.bad{color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,transparent)}

/* Entrada */
.splash{flex:1;display:flex;flex-direction:column;gap:18px;margin:0 -20px;padding:max(40px,7vh) 20px 0;background:radial-gradient(52% 58% at 80% 34%,color-mix(in srgb,var(--g2) 24%,transparent),transparent 72%) no-repeat,radial-gradient(50% 55% at 16% 14%,color-mix(in srgb,var(--g1) 26%,transparent),transparent 72%) no-repeat,radial-gradient(46% 50% at 46% 82%,color-mix(in srgb,var(--g3) 20%,transparent),transparent 74%) no-repeat;background-size:100% 380px}
.hero-torches{display:flex;gap:6px}
.hero-torches .torch{width:22px;height:25px}
.mega{font-size:clamp(38px,11vw,50px);line-height:1.02;font-weight:700;letter-spacing:-.035em}
.mega em{display:block;font:800 2.55em/.98 var(--round);font-style:normal;letter-spacing:-.05em;padding-bottom:.06em;margin-left:-.04em}
.fases li{position:relative;display:grid;grid-template-columns:24px 1fr auto;gap:12px;align-items:center;padding:13px 16px}
.fases b{font-weight:600}
.fases li[data-f="1"],.fase[data-f="1"],.mix li[data-f="1"],.stop[data-f="1"]{--accent:var(--p1);--on-accent:var(--p1on)}
.fases li[data-f="2"],.fase[data-f="2"],.mix li[data-f="2"],.stop[data-f="2"]{--accent:var(--p2);--on-accent:var(--p2on)}
.fases li[data-f="3"],.fase[data-f="3"],.mix li[data-f="3"],.stop[data-f="3"]{--accent:var(--p3);--on-accent:var(--p3on)}

/* Mapa */
.fase-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:0 4px}
.fase-h h2{font-size:20px;font-weight:700;letter-spacing:-.022em;white-space:nowrap}
.fase-h span{font-size:13px;line-height:1.3;color:var(--ink2);text-align:right}
.etapas{margin-top:8px}
.etapa{position:relative;display:grid;grid-template-columns:32px 1fr;gap:12px;align-items:center;padding:11px 16px}
.etapa+.etapa::after{left:60px}
.etapa .num{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--fill);color:var(--ink2);font:700 15px/1 var(--round)}
.etapa .nm{font-weight:600;line-height:1.25;display:block}
.etapa .st{font-size:14px;color:var(--ink2);display:block}
.etapa.done .num{background:var(--ok);color:var(--on-ok)}
.etapa.now .num{background:var(--accent);color:var(--on-accent)}
.etapa.now .st{color:var(--accent);font-weight:600}
.etapa.locked .nm{color:var(--ink2)}

/* Provas com validação */
.chk{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;padding:10px 12px 10px 16px}
.chk.one{grid-template-columns:1fr auto}
.lab{display:flex;gap:10px;align-items:center}
.chk.one .lab{align-items:flex-start;font-size:16px;line-height:1.38}
.score{font-size:15px;color:var(--ink2);padding:0 4px}
.score b{font:700 22px/1 var(--round);color:var(--ink);margin-right:2px;font-variant-numeric:tabular-nums}
.shots{display:flex;gap:10px}
.shot{width:48px;height:48px;border-radius:50%;background:var(--fill);display:grid;place-items:center;font:700 17px/1 var(--round);color:var(--ink2)}
.shot.g{background:var(--ok);color:var(--on-ok)}
.shot.m{background:color-mix(in srgb,var(--bad) 15%,transparent);color:var(--bad)}
.q{font-size:clamp(24px,7vw,28px);line-height:1.15;font-weight:700;letter-spacing:-.025em;text-wrap:balance}
.opts{display:grid;gap:8px}
.opt{min-height:54px;text-align:left;padding:14px 16px;background:var(--card);border:0;border-radius:14px;font-weight:500}
.opt:disabled{cursor:default;color:var(--ink)}
.opt.right{box-shadow:inset 0 0 0 2px var(--ok);color:var(--ok)}
.opt.wrong{box-shadow:inset 0 0 0 2px var(--bad);color:var(--bad)}

/* Traidores */
.names{display:grid;gap:8px}
.namerow{display:grid;grid-template-columns:24px 1fr auto;gap:10px;align-items:center}
.inp{min-height:48px;width:100%;background:var(--card);border:0;border-radius:12px;padding:10px 14px}
.inp::placeholder{color:var(--ink3)}
.phrase{background:var(--card);border-radius:16px;padding:14px 16px;display:grid;gap:6px}
.phrase q{font-size:22px;font-weight:600;letter-spacing:-.02em;line-height:1.25;quotes:"«" "»"}
.picks{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pick{min-height:52px;background:var(--card);border:0;border-radius:14px;font-weight:600;padding:8px 10px;overflow-wrap:anywhere}
.pick.on{background:var(--accent);color:var(--on-accent)}
.timer{display:flex;align-items:center;min-height:48px}

/* Paciência */
.golf{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;align-items:start;min-height:calc((min(100vw,480px) - 70px)/6*3.2)}
.gcol{display:grid}
.pc{display:grid;grid-template-rows:auto 1fr;aspect-ratio:5/7;width:100%;border:0;border-radius:9px;background:var(--pc);color:var(--pc-ink);padding:4px 6px 3px;text-align:left;font:700 18px/1 var(--round);box-shadow:var(--pc-sh)}
.pc.red{color:var(--pc-red)}
.pc .su{align-self:end;justify-self:end;font:400 19px/1 "Times New Roman",serif}
.gcol .pc+.pc{margin-top:-80%}
.pc.back{background:linear-gradient(135deg,var(--g1),var(--g2) 55%,var(--g3));box-shadow:inset 0 0 0 3px var(--pc),var(--pc-sh)}
.slot{aspect-ratio:5/7;border:1.5px dashed var(--ink3);border-radius:9px}
.deckrow{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;align-items:end;margin-top:6px}
.deck{display:grid;gap:6px;justify-items:center}
.deck:nth-child(1){grid-column:2} .deck:nth-child(2){grid-column:5}
.deck .lbl{white-space:nowrap}
@keyframes no{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.no{animation:no .25s}

/* Cores */
.tubes{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;align-items:end;padding:28px 0 20px}
.tube{width:100%;aspect-ratio:10/37;border:1.5px solid var(--ink3);border-top:0;border-radius:0 0 999px 999px;background:var(--fill);display:flex;flex-direction:column-reverse;align-items:center;gap:3px;padding:5px 0 6px}
.tube{position:relative}
.tube.sel{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent)}
.tube.hf,.tube.ht{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,transparent)}
.tube.hf::after,.tube.ht::after{content:"de";position:absolute;left:50%;bottom:-20px;transform:translateX(-50%);font:700 12px/1 var(--round);letter-spacing:.04em;text-transform:uppercase;color:var(--ok)}
.tube.ht::after{content:"para"}
.ball{width:calc(100% - 6px);aspect-ratio:1;border-radius:50%;flex:none;transition:transform .2s cubic-bezier(.3,1.5,.5,1)}
.tube.sel .ball:last-child{transform:translateY(-20px)}
.c0{background:radial-gradient(circle at 32% 28%,var(--gloss),transparent 46%),var(--c0)}
.c1{background:radial-gradient(circle at 32% 28%,var(--gloss),transparent 46%),var(--c1)}
.c2{background:radial-gradient(circle at 32% 28%,var(--gloss),transparent 46%),var(--c2)}
.c3{background:radial-gradient(circle at 32% 28%,var(--gloss),transparent 46%),var(--c3)}
.c4{background:radial-gradient(circle at 32% 28%,var(--gloss),transparent 46%),var(--c4)}
.c5{background:radial-gradient(circle at 32% 28%,var(--gloss),transparent 46%),var(--c5)}

/* Lição */
.prompt{font-size:clamp(26px,7.6vw,32px);line-height:1.12;font-weight:700;letter-spacing:-.028em;text-wrap:balance}
.answer{min-height:68px;box-shadow:0 .5px 0 var(--sep);display:flex;flex-wrap:wrap;gap:8px;padding:8px 0 14px;align-content:flex-start}
.bank{display:flex;flex-wrap:wrap;gap:8px}
.tile{min-height:44px;padding:9px 14px;background:var(--card);border:0;border-radius:12px;font-weight:500;box-shadow:0 0 0 .5px var(--sep),0 1.5px 0 var(--sep)}
.tile:disabled{opacity:.3;cursor:default;color:var(--ink)}
.answer .tile:disabled{opacity:1}
.code{width:150px;font:700 44px/1 var(--round);text-align:center;letter-spacing:.1em;background:var(--card);border:0;border-radius:16px;padding:14px 8px 12px;font-variant-numeric:tabular-nums}

/* Castigo, prenda, final */
.castigo{background:var(--card);border-radius:16px;padding:14px 16px;display:grid;gap:4px;font-size:19px;font-weight:600;letter-spacing:-.018em;line-height:1.3}
.castigo .lbl{color:var(--bad)}
.gift{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:20px 0 8px}
.gift .tag{align-self:center;margin:0}
.gift .n{font:800 min(50vw,200px)/1 var(--round);letter-spacing:-.04em;padding:0 .06em;animation:rise .7s cubic-bezier(.2,.9,.2,1) both}
.gift h1{font-size:clamp(30px,8.8vw,38px);line-height:1.08;font-weight:700;letter-spacing:-.03em;text-wrap:balance;animation:rise .7s .12s cubic-bezier(.2,.9,.2,1) both}
@keyframes rise{from{transform:translateY(22px) scale(.95);opacity:0}to{transform:none;opacity:1}}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--card);border-radius:16px;padding:13px 16px 14px;display:grid;gap:2px}
.stat b{font:700 34px/1.1 var(--round);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.won li{display:flex;gap:12px;align-items:center;padding:12px 16px;font-weight:500}
.prep li{padding:12px 16px;font-size:15px;line-height:1.4}
.jump{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.jump .mini{min-width:0;padding:0;aspect-ratio:1;font:700 16px/1 var(--round)}
.confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:9}

/* Formato */
.mix li{position:relative;display:grid;grid-template-columns:36px 1fr;column-gap:12px;align-items:center;padding:11px 16px}
.mix li+li::after{left:64px}
.mix li.manias{--accent:var(--g2);--on-accent:#ffffff}
.ico{grid-row:1/span 2;width:36px;height:36px;border-radius:10px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center}
.ico svg{width:20px;height:20px;fill:currentColor}
.mix b{font-weight:600}
.mix li>span:last-child{grid-column:2;font-size:14.5px;line-height:1.36;color:var(--ink2)}

/* Pares de palavras */
.pairs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.paircol{display:grid;gap:7px;align-content:start}
.pair{min-height:46px;background:var(--card);border:0;border-radius:12px;font-weight:500;padding:8px 10px;box-shadow:0 0 0 .5px var(--sep),0 1.5px 0 var(--sep)}

.parcel{background:var(--card);border-radius:18px;padding:14px 16px 12px;display:grid;gap:10px;box-shadow:var(--pc-sh)}
.lrow{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:start}
.lrow>div{display:grid;gap:1px;min-width:0}
.lrow.specs{grid-template-columns:auto 1fr;gap:24px;padding-top:10px;box-shadow:0 -.5px 0 var(--sep)}
.dest b{font-size:18px;font-weight:700;letter-spacing:-.02em}
.dest span:not(.lbl){font-size:16px;line-height:1.3}
.pais{justify-items:end}
.pais b{font:800 34px/1 var(--round);letter-spacing:-.01em}
.specs b{font:700 19px/1.25 var(--round);font-variant-numeric:tabular-nums}
.parcel::after{content:"";height:20px;opacity:.82;background:repeating-linear-gradient(90deg,var(--ink) 0 2px,transparent 2px 5px,var(--ink) 5px 6px,transparent 6px 10px,var(--ink) 10px 13px,transparent 13px 15px)}
.bins{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.bin{min-height:54px;background:var(--card);border:0;border-radius:14px;font-weight:600;font-size:16px;padding:8px 10px}

.album{display:grid;grid-template-columns:1fr 1fr;gap:12px 10px}
.ph{display:grid;gap:6px;align-content:start;background:none;border:0;padding:0;text-align:left;font-size:14px;line-height:1.3;color:var(--ink)}
.ph .box{aspect-ratio:1;border-radius:14px;overflow:hidden;background:var(--fill);display:grid;place-items:center;color:var(--ink3);font:300 44px/1 var(--round)}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph.locked{opacity:.5;cursor:default}
.gift .n.small{font-size:min(30vw,120px)}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

/* Ligação: API REST da Realtime Database, com escuta por EventSource. */
const fb = p => `${DB}/prova/${SALA}${p ? '/' + p : ''}.json`;
const req = (m, p, v) => ONLINE ? fetch(fb(p), v === undefined ? {method: m} : {method: m, body: JSON.stringify(v)}).catch(() => null) : Promise.resolve(null);
const net = {put: (p, v) => req('PUT', p, v), post: (p, v) => req('POST', p, v), del: p => req('DELETE', p)};
function setAt(root, path, val){
  const ks = path.split('/').filter(Boolean);
  if(!ks.length) return val;
  if(root === null || typeof root !== 'object') root = {};
  let o = root;
  for(let i = 0; i < ks.length - 1; i++){ if(o[ks[i]] === null || typeof o[ks[i]] !== 'object') o[ks[i]] = {}; o = o[ks[i]]; }
  if(val === null || val === undefined) delete o[ks[ks.length - 1]]; else o[ks[ks.length - 1]] = val;
  return root;
}
/* Cada escuta refaz-se sozinha: ao voltar à app, quando a rede muda, ou se ficar calada tempo de mais. */
const ESCUTAS = [];
function abre(w){
  try{ if(w.es) w.es.close(); }catch(e){}
  w.data = null; w.last = Date.now();
  const es = w.es = new EventSource(fb(w.p));
  es.addEventListener('put', e => { w.last = Date.now(); const m = JSON.parse(e.data); w.data = setAt(w.data, m.path, m.data); w.cb(w.data, m.path); });
  es.addEventListener('patch', e => { w.last = Date.now(); const m = JSON.parse(e.data); Object.keys(m.data || {}).forEach(k => { w.data = setAt(w.data, (m.path === '/' ? '' : m.path) + '/' + k, m.data[k]); }); w.cb(w.data, m.path + '/*'); });
  es.addEventListener('keep-alive', () => { w.last = Date.now(); });
  es.onopen = () => { w.last = Date.now(); };
}
function watch(p, cb){
  if(!ONLINE || typeof EventSource === 'undefined') return;
  const w = {p, cb}; ESCUTAS.push(w); abre(w);
}
const AOVOLTAR = [];
if(ONLINE){
  document.addEventListener('visibilitychange', () => { if(!document.hidden){ ESCUTAS.forEach(abre); AOVOLTAR.forEach(f => f()); } });
  window.addEventListener('online', () => { ESCUTAS.forEach(abre); AOVOLTAR.forEach(f => f()); });
  setInterval(() => { ESCUTAS.forEach(w => { if(Date.now() - w.last > 75000 || w.es.readyState === 2) abre(w); }); }, 15000);
}

/* Dica do jogo das cores: primeira jogada da solução mais curta a partir da posição actual. */
function dica(tubes){
  const done = t => t.every(x => !x.length || (x.length === 4 && x.every(c => c === x[0])));
  const key = t => t.map(x => x.join('')).sort().join('|');
  const seen = new Set([key(tubes)]);
  let front = [[tubes, null]];
  while(front.length){
    const next = [];
    for(const [t, first] of front){
      for(let a = 0; a < t.length; a++){
        const A = t[a]; if(!A.length || (A.length === 4 && A.every(c => c === A[0]))) continue;
        const c = A[A.length - 1]; let vazio = false;
        for(let b = 0; b < t.length; b++){
          if(a === b) continue; const B = t[b]; if(B.length >= 4) continue;
          if(!B.length){ if(vazio || A.every(x => x === c)) continue; vazio = true; }
          else if(B[B.length - 1] !== c) continue;
          const u = t.map(x => x.slice()); u[b].push(u[a].pop());
          const k = key(u); if(seen.has(k)) continue; seen.add(k);
          const f = first || [a, b];
          if(done(u)) return {r:'ok', move:f};
          next.push([u, f]);
        }
      }
    }
    if(seen.size > 250000) return {r:'cap'};
    front = next;
  }
  return {r:'none'};
}

function loadFotos(){
  return new Promise(done => {
    try{
      const rq = indexedDB.open('prova-dos-sete', 1);
      rq.onupgradeneeded = () => rq.result.createObjectStore('fotos');
      rq.onerror = rq.onblocked = () => done();
      rq.onsuccess = () => {
        idb = rq.result;
        try{
          const cur = idb.transaction('fotos').objectStore('fotos').openCursor();
          cur.onerror = () => done();
          cur.onsuccess = () => { const c = cur.result; if(c){ FOTO[c.key] = URL.createObjectURL(c.value); c.continue(); } else done(); };
        }catch(e){ done(); }
      };
    }catch(e){ done(); }
  });
}
function saveFoto(id, blob){
  if(FOTO[id]) URL.revokeObjectURL(FOTO[id]);
  FOTO[id] = URL.createObjectURL(blob);
  try{ if(idb) idb.transaction('fotos', 'readwrite').objectStore('fotos').put(blob, id); }catch(e){}
}
function clearFotos(){
  Object.keys(FOTO).forEach(k => { URL.revokeObjectURL(FOTO[k]); delete FOTO[k]; });
  try{ if(idb) idb.transaction('fotos', 'readwrite').objectStore('fotos').clear(); }catch(e){}
}
cam.addEventListener('change', () => {
  const f = cam.files && cam.files[0], id = pend; pend = '';
  if(!f || !id) return;
  const url = URL.createObjectURL(f), im = new Image();
  im.onerror = () => URL.revokeObjectURL(url);
  im.onload = () => {
    const k = Math.min(1, 1400 / Math.max(im.naturalWidth, im.naturalHeight)), cv = document.createElement('canvas');
    cv.width = Math.max(1, Math.round(im.naturalWidth * k)); cv.height = Math.max(1, Math.round(im.naturalHeight * k));
    cv.getContext('2d').drawImage(im, 0, 0, cv.width, cv.height);
    URL.revokeObjectURL(url);
    cv.toBlob(b => { if(b){ saveFoto(id, b); render(); } }, 'image/jpeg', .82);
  };
  im.src = url;
});

    const col = (side, order, sel) => order.map(i => `<button class="pair${d.ok[i] ? ' done' : ''}${sel === i ? ' on' : ''}" data-a="pairTap" data-v="${side}:${i}"${d.ok[i] || out ? ' disabled' : ''}${side === 'L' ? ' lang="nl"' : ''}>${PARES[i][side === 'L' ? 0 : 1]}</button>`).join('');
    return parte(1, 2) + `<div class="shift"><span class="eyebrow">Lição do dia · a ementa</span><span class="lives" role="img" aria-label="${left} de ${PARES_ERROS + 1} vidas">${hearts(left, PARES_ERROS + 1)}</span></div>
      <h1 class="prompt">Liga os pares</h1>
      <div class="pairs"><div class="paircol">${col('L', d.L, d.selL)}</div><div class="paircol">${col('R', d.R, d.selR)}</div></div>
      ${all ? fbx('ok', 'Oito em oito. Cinco destas vão à mesa.') : out ? fbx('bad', 'Três erros. Perdes uma tocha.') : d.bad ? fbx('bad', 'Esse par não existe. Perdeste uma vida.') : ''}`
      + acts(out ? btn('Continuar', 's1paresFail') : btn('Continuar', 's1venda', {dis: !all}));
  }
  if(S.step === 'venda') return parte(2, 2) + `<h1 class="title">Agora, de olhos vendados</h1>
    <p class="lead">Das oito palavras, só cinco vão à mesa. Dizes o que é cada uma, em holandês.</p>`
    + host('Põe a venda à Ana antes de avançares. O ecrã seguinte mostra as respostas.')
    + acts(btn('A Ana já tem a venda', 's1go'));
  const ok = d.r.filter(x => x === 1).length, all = d.r.every(x => x > 0), oculto = hostOn();
  return parte(2, 2) + `<h1 class="title">Cinco colheres</h1>
    <p class="lead">${oculto ? 'O apresentador marca as tuas respostas no telemóvel dele. Diz o nome de cada coisa em holandês.' : 'A Ana prova e diz o nome em holandês. Marca cada resposta.'}</p>
    <ul class="group"${oculto ? ' hidden' : ''}>${PROVAS.map((p, i) => `<li class="chk"><span class="lab"><span class="num-s">${i + 1}</span><span>${p[0]}<br><span class="muted small" lang="nl">${p[1]}</span></span></span>
      <button class="mini ok${d.r[i] === 1 ? ' on' : ''}" data-a="s1mark" data-v="${i}:1" aria-pressed="${d.r[i] === 1}">Acertou</button>
      <button class="mini bad${d.r[i] === 2 ? ' on' : ''}" data-a="s1mark" data-v="${i}:2" aria-pressed="${d.r[i] === 2}">Falhou</button></li>`).join('')}</ul>
    <p class="score"><b>${ok}</b> certas em 5. São precisas 4.</p>`
    + acts(btn('Fechar a prova', 's1end', {dis: !all}));
}

/* ---------- Etapa 2: penáltis ---------- */
function etiqueta(e){
  return `<div class="parcel">
    <div class="lrow"><div class="dest"><span class="lbl">Destinatário</span><b>${e.n}</b><span>${e.m}</span><span>${e.cp} ${e.c}</span></div><div class="pais"><span class="lbl">País</span><b>${e.p}</b></div></div>
    <div class="lrow specs"><div><span class="lbl">Peso</span><b>${e.kg} kg</b></div><div><span class="lbl">Dimensões em cm</span><b>${e.d}</b></div></div>
  </div>`;
}
function v2(){
  const d = S.d;
  if(S.step === 'brief') return etapaTag() + `<h1 class="title">Penáltis de imunidade</h1>
    <p class="lead">Na Ilha, a imunidade ganha-se à bola. Mas antes do jogo há um turno de trabalho para fazer.</p>`
    + rules(['No telemóvel: um turno na Sendcloud. Doze etiquetas para conferir em 100 segundos, e dez têm de sair certas.', 'No corredor: cinco penáltis com a bola de meias, todos com o pé mais fraco. Precisas de três golos.', 'Cada prova falhada apaga uma tocha.'])
    + acts(btn('Ver as regras do turno', 's2regras'));
  if(S.step === 'regras') return parte(1, 2) + `<p class="eyebrow">Turno na Sendcloud</p><h1 class="title">Regras do armazém</h1>
    <ul class="group prep">
      <li><strong>Origem.</strong> Tudo sai de Eindhoven.</li>
      <li><strong>Alfândega.</strong> Leva documentos o que sai da UE ou da zona de IVA da UE.</li>
      <li><strong>Peso a cobrar.</strong> O maior entre o real e o volumétrico: comprimento × largura × altura ÷ 5000.</li>
      <li><strong>Sobretaxas.</strong> Mais de 30 kg é excesso de peso. Lado maior acima de 120 cm é sobredimensão. Ilha é zona remota.</li>
      <li><strong>Etiqueta.</strong> O código postal tem de bater com o país, e nada pesa zero.</li>
    </ul>
    <p class="muted small" style="padding:0 4px">O relógio arranca quando picares o ponto.</p>`
    + acts(btn('Picar o ponto', 's2sc'));
  if(S.step === 'sc'){
    const e = ENCOMENDAS[d.order[d.i]], Q = PERGUNTAS[e.t], gone = Math.max(0, Date.now() - (d.tEnd - TURNO));
    return parte(1, 2) + `<div class="shift"><span class="eyebrow">Etiqueta ${d.i + 1} de ${d.order.length}</span><span class="clock" id="sc-clock">${fmt(d.tEnd - Date.now() + 999)}</span></div>
      <div class="timebar"><i style="animation-duration:${TURNO}ms;animation-delay:-${gone}ms"></i></div>
      ${etiqueta(e)}
      <h1 class="q">${Q.q}</h1>
      <div class="bins">${Q.o.map((o, i) => `<button class="bin" data-a="s2bin" data-v="${i}">${o}</button>`).join('')}</div>
      <p class="muted small" style="padding:0 4px">Volumétrico: C × L × A ÷ 5000. Limites: 30 kg e 120 cm.</p>`;
  }
  if(S.step === 'scres'){
    const pass = d.ok >= TURNO_MIN, falta = d.order.length - d.i;
    return parte(1, 2) + `<h1 class="title">${d.ok} em ${d.order.length}</h1>
      <p class="lead">${pass ? 'Turno cumprido. Podes ir para o relvado.' : falta ? `Acabou o turno com ${falta} ${falta === 1 ? 'etiqueta' : 'etiquetas'} por conferir. Perdes uma tocha.` : 'Não chegou às dez. Perdes uma tocha.'}</p>
      ${d.wrong.length ? `<h2 class="sec">Onde falhaste</h2><ul class="group prep">${d.wrong.map(k => { const e = ENCOMENDAS[k], Q = PERGUNTAS[e.t]; return `<li><strong>${e.c}, ${e.p}.</strong> ${Q.q} ${Q.o[e.a]}. ${e.w}</li>`; }).join('')}</ul>` : ''}`
      + acts(btn('Continuar', 's2scres'));
  }
  if(S.step === 'marca') return parte(2, 2) + `<h1 class="title">Agora, à bola</h1>
    <p class="lead">Hoje o corredor chama-se Alvalade.</p>`
    + rules(['Cinco remates com a bola de meias, da marca que o júri fizer no chão. Todos com o pé mais fraco.', 'Na baliza fica quem o júri escolher.', 'Três golos e a prenda é tua. Três defesas apagam uma tocha.'])
    + acts(btn('Ir para a marca', 's2go'));
  const g = d.shots.filter(x => x === 1).length, m = d.shots.length - g, end = g >= 3 || m >= 3;
  const dots = [0,1,2,3,4].map(i => { const s = d.shots[i]; return `<span class="shot${s === 1 ? ' g' : s === 0 ? ' m' : ''}">${s === 1 ? CHECK : s === 0 ? CROSS : i + 1}</span>`; }).join('');
  return parte(2, 2) + `<h1 class="title">${end ? `${g} ${g === 1 ? 'golo' : 'golos'} em ${d.shots.length}` : `Remate ${d.shots.length + 1} de 5`}</h1>
    <div class="shots" role="img" aria-label="${g} golos, ${m} defesas">${dots}</div>`
    + (g >= 3 ? `<p class="lead">Três golos. A imunidade é tua.</p>` + acts(btn('Receber a prenda', 'winNow'))
      : m >= 3 ? `<p class="lead">Três defesas. Hoje ganhou a baliza.</p>` + acts(btn('Continuar', 'failGift'))
      : `<p class="lead">Pé mais fraco. O júri decide o que foi golo.</p>` + acts(`<div class="row">${btn('Golo', 's2shot', {v:'1', cls:'ok'})}${btn('Defendido', 's2shot', {v:'0', cls:'bad'})}</div>`));
}

/* ---------- Etapa 3: memória ---------- */
function v3(){
  const d = S.d;
  if(S.step === 'brief') return etapaTag() + `<h1 class="title">Memória de 2026</h1>
    <p class="lead">A última etapa da Ilha puxa pelo ano que está a acabar: primeiro os dedos, depois a cabeça, no fim a câmara.</p>`
    + rules([`No telemóvel: um jogo da memória com oito pares e só ${MEM_MAX} tentativas.`, `Cinco perguntas sobre 2026: três do mundo, duas da vossa vida. Precisas de ${QUIZ_MIN} certas.`, 'Três fotografias em cinco minutos, tiradas com a tua câmara e aprovadas pelo júri.'])
    + acts(btn('Começar', 's3mem'));
  if(S.step === 'mem'){
    const all = d.cards.every(c => c.ok), out = !all && !d.lock && d.moves >= MEM_MAX;
    return parte(1, 3) + `<p class="eyebrow">Jogo da memória</p><h1 class="prompt">Encontra os oito pares</h1>
      <div class="mem">${d.cards.map((c, i) => `<button class="mc${c.ok ? ' ok' : c.up ? ' up' : ''}" data-a="memTap" data-v="${i}" aria-label="Carta ${i + 1}${c.up || c.ok ? ', virada' : ''}">${c.up || c.ok ? MEMO[c.k] : ''}</button>`).join('')}</div>
      <p class="score"><b>${d.moves}</b> de ${MEM_MAX} tentativas</p>
      ${all ? fbx('ok', 'Memória em forma.') : out ? fbx('bad', `Acabaram as ${MEM_MAX} tentativas. Perdes uma tocha.`) : ''}`
      + acts(out ? btn('Continuar', 's3memFail') : btn('Continuar', 's3go', {dis: !all}));
  }
  if(S.step === 'quiz'){
    const Q = QUIZ[d.q], done = d.ans !== null, last = d.q === QUIZ.length - 1;
    let body;
    if(Q.live){
      body = host('Faz a tua pergunta em voz alta e diz se a Ana acertou.')
        + (done ? fbx(d.ans === 'ok' ? 'ok' : 'bad', d.ans === 'ok' ? 'Certa.' : 'Errada.')
                : `<div class="row">${btn('Certa', 's3live', {v:'ok', cls:'ok small'})}${btn('Errada', 's3live', {v:'no', cls:'bad small'})}</div>`);
    } else {
      body = `<div class="opts">${Q.o.map((o, i) => `<button class="opt${done && i === Q.a ? ' right' : done && i === d.ans ? ' wrong' : ''}" data-a="s3ans" data-v="${i}"${done ? ' disabled' : ''}>${o}</button>`).join('')}</div>`
        + (done ? fbx(d.ans === Q.a ? 'ok' : 'bad', d.ans === Q.a ? 'Certa.' : 'Errada. Era ' + Q.o[Q.a] + '.') : '');
    }
    return parte(2, 3, `Pergunta ${d.q + 1} de ${QUIZ.length}`) + `<h1 class="q">${Q.q}</h1>` + body
      + `<p class="score"><b>${d.score}</b> certas. São precisas ${QUIZ_MIN}.</p>`
      + acts(btn(last ? 'Ver o resultado' : 'Pergunta seguinte', 's3next', {dis: !done}));
  }
  if(S.step === 'quizres'){
    const pass = d.score >= QUIZ_MIN;
    return parte(2, 3) + `<h1 class="title">${d.score} em ${QUIZ.length}</h1>
      <p class="lead">${pass ? 'A cabeça passou. Agora a câmara.' : 'Não chegou. Perdes uma tocha e depois segues para a câmara.'}</p>`
      + acts(btn('Continuar', 's3res'));
  }
  const all = d.f.every(x => x);
  return parte(3, 3) + `<h1 class="title">Três fotografias</h1>
    <p class="lead">A Ana fotografa, o júri aprova. Tudo em cinco minutos.</p>
    <div class="timer">${d.tEnd ? `<span class="clock big" id="mesa-clock">${fmt(d.tEnd - Date.now())}</span>` : `<button class="mini" data-a="s3timer">Começar os cinco minutos</button>`}</div>
    <ul class="group">${FOTOS.map((t, i) => `<li class="chk one"><span class="lab"><span class="num-s">${i + 1}</span><span>${t}</span></span>
      <button class="mini ok${d.f[i] ? ' on' : ''}" data-a="s3foto" data-v="${i}" aria-pressed="${!!d.f[i]}">Aprovada</button></li>`).join('')}</ul>`
    + acts(btn('Receber a prenda', 'winNow', {dis: !all}), `<button class="link" data-a="failGift">O tempo acabou</button>`);
}

/* ---------- Etapa 4: traidores ---------- */
function v4(){
  const d = S.d, P = d.players || [];
  const active = P.map((p, i) => ({nm: p.nm, role: p.role, i, out: p.out})).filter(p => !p.out);
  const k = Math.min(3, active.length);
  switch(S.step){
    case 'brief': return etapaTag() + `<h1 class="title">Há traidores à mesa</h1>
      <p class="lead">Bem-vindos à Mesa Redonda. Entre os convidados da Ana há quem tenha vindo almoçar e quem tenha vindo trair.</p>`
      + rules(['Cada jogador vê em segredo de que lado está.', 'São três rondas. Em cada uma há uma missão de grupo e depois a Ana bane um suspeito.', 'Se a Ana banir todos os que a traem até ao fim da terceira ronda, a prenda é dela. Se sobrar alguém, apaga-se uma tocha.'])
      + acts(btn('Inscrever os jogadores', 's4go'));
    case 'lobby': {
      const J = Object.keys(MESA.jog).map(id => ({id, nm: MESA.jog[id].nm, t: MESA.jog[id].t || 0})).sort((a, b) => a.t - b.t);
      return etapaTag() + `<h1 class="title">Quem está à mesa?</h1>
        <p class="lead">Cada convidado abre a app da Mesa Redonda no seu telemóvel e escreve o nome. A Ana não entra: lidera os fiéis e nunca trai.</p>
        <ul class="group">${J.map((j, i) => `<li class="chk one"><span class="lab"><span class="num-s">${i + 1}</span><span>${esc(j.nm)}</span></span><button class="mini" style="min-width:60px" data-a="s4kick" data-v="${esc(j.id)}">Tirar</button></li>`).join('') || '<li class="chk one"><span class="muted">Ainda ninguém entrou.</span></li>'}</ul>
        <p class="muted small" style="padding:0 4px">Com 4 ou 5 jogadores, uma pessoa trai. Com 6 ou mais, duas.</p>`
        + acts(btn(`Distribuir os papéis · ${J.length}`, 's4deal', {dis: J.length < 4}), `<button class="link" data-a="s4local">Jogar sem telemóveis</button>`);
    }
    case 'nomes': return etapaTag() + `<h1 class="title">Quem está à mesa?</h1>
      <p class="lead">Escreve todos menos a Ana. Ela lidera os fiéis e nunca trai.</p>
      <div class="names">${d.names.map((nm, i) => `<div class="namerow"><label for="name-${i}" class="num-s">${i + 1}</label><input id="name-${i}" class="inp" data-bind="name" data-i="${i}" value="${esc(nm)}" placeholder="Nome" autocomplete="off" maxlength="18">${d.names.length > 4 ? `<button class="mini" style="min-width:60px" data-a="s4del" data-v="${i}" aria-label="Tirar o jogador ${i + 1}">Tirar</button>` : '<span></span>'}</div>`).join('')}</div>
      ${d.names.length < 12 ? `<button class="link" style="align-self:flex-start" data-a="s4add">Adicionar jogador</button>` : ''}
      <p class="muted small">Com 4 ou 5 jogadores, uma pessoa trai. Com 6 ou mais, duas.</p>
      ${d.err ? `<p class="fb bad" role="alert">${d.err}</p>` : ''}`
      + acts(btn('Distribuir os papéis', 's4deal'));
    case 'papeis': {
      const p = P[d.idx], nm = esc(p.nm);
      if(!d.shown) return tag(`Jogador ${d.idx + 1} de ${P.length}`) + `<h1 class="title">Passa o telemóvel a ${nm}</h1>
        <p class="lead">Só ${nm} pode ver o ecrã seguinte.</p>` + acts(btn(`Sou ${nm}. Mostrar`, 's4show'));
      const other = P.filter((x, i) => x.role === 'T' && i !== d.idx).map(x => esc(x.nm));
      return tag(nm) + (p.role === 'T'
        ? `<h1 class="title role bad">Traição</h1><p class="lead">Estás contra a Ana. Sabota as missões sem dar nas vistas e não te deixes banir.</p>${other.length ? `<p class="lead">Trai contigo: <strong>${other.join(', ')}</strong>.</p>` : ''}`
        : `<h1 class="title role ok">Lealdade</h1><p class="lead">Estás do lado da Ana. Cumpre as missões e ajuda-a a descobrir quem trai.</p>`)
        + acts(btn('Esconder e passar', 's4hide'));
    }
    case 'pronto': return etapaTag() + `<h1 class="title">Papéis entregues</h1>
      <p class="lead">${d.mode === 'on' ? 'Cada jogador tem o seu papel no próprio telemóvel. Ninguém mostra o ecrã a ninguém.' : 'Devolvam o telemóvel ao apresentador. Ninguém fala do que viu.'}</p>` + acts(btn('Começar a ronda 1', 's4begin'));
    case 'missao': {
      const M = MISSOES[d.round - 1];
      return tag(`Ronda ${d.round} de 3 · Missão`) + `<h1 class="title">${M.t}</h1>` + rules(M.r)
        + (M.frase ? `<div class="phrase"><b class="lbl">Só para a Ana</b><q>${M.frase}</q></div>` : '')
        + `<p class="muted small" style="padding:0 4px">${M.nota}</p>`
        + (d.round < 3 ? acts(`<div class="row">${btn('Cumprida', 's4m', {v:'1', cls:'ok'})}${btn('Falhada', 's4m', {v:'0', cls:'bad'})}</div>`)
                       : acts(btn('Escolher a equipa', 's4team')));
    }
    case 'equipa': return tag('Ronda 3 · Equipa') + `<h1 class="title">Quem vai na missão?</h1>
      <p class="lead">Ana, escolhe ${k} ${k === 1 ? 'nome' : 'nomes'}.</p>
      <div class="picks">${active.map(p => `<button class="pick${d.team.includes(p.i) ? ' on' : ''}" data-a="s4tog" data-v="${p.i}" aria-pressed="${d.team.includes(p.i)}">${esc(p.nm)}</button>`).join('')}</div>`
      + acts(btn('Começar a votação', 's4vote0', {dis: d.team.length !== k}));
    case 'voto': {
      if(d.mode === 'on'){
        const nv = d.team.filter(i => MESA.voto[P[i].id]).length;
        return tag('Ronda 3 · Voto secreto') + `<h1 class="title">${nv} de ${d.team.length} votos</h1>
          <p class="lead">A equipa vota em segredo, cada um no seu telemóvel.</p>
          <ul class="group">${d.team.map(i => `<li class="chk one"><span class="lab"><span>${esc(P[i].nm)}</span></span><span class="muted small">${MESA.voto[P[i].id] ? 'Votou' : 'A votar'}</span></li>`).join('')}</ul>`
          + acts(btn('Fechar a votação', 's4close', {cls:'alt small'}));
      }
      const nm = esc(P[d.team[d.vi]].nm);
      if(!d.shown) return tag(`Voto ${d.vi + 1} de ${d.team.length}`) + `<h1 class="title">Passa o telemóvel a ${nm}</h1>
        <p class="lead">Ninguém mais olha para o ecrã.</p>` + acts(btn(`Sou ${nm}. Votar`, 's4vshow'));
      return tag(nm) + `<h1 class="title">O teu voto</h1><p class="lead">Carrega e passa o telemóvel de volta, com o ecrã para baixo.</p>`
        + acts(btn('Cumprir a missão', 's4v', {v:'c', cls:'alt'}), btn('Sabotar a missão', 's4v', {v:'s', cls:'alt'}));
    }
    case 'mres': return tag('Ronda 3 · Missão') + `<h1 class="title role ${d.sab ? 'bad' : 'ok'}">${d.sab ? 'Sabotada' : 'Cumprida'}</h1>
      <p class="lead">Votos de sabotagem: <strong>${d.sab}</strong>.</p>` + acts(btn('Ir para a Mesa Redonda', 's4mesa'));
    case 'mesa': {
      const okM = d.log[d.log.length - 1];
      return tag(`Ronda ${d.round} de 3 · Mesa Redonda`) + `<h1 class="title">Quem trai a Ana?</h1>
        <p class="lead">A missão ${okM ? 'foi cumprida' : 'falhou'}. Discutam. Depois a Ana bane uma pessoa.</p>
        <div class="timer">${d.tEnd ? `<span class="clock big" id="mesa-clock">${fmt(d.tEnd - Date.now())}</span>` : `<button class="mini" data-a="s4timer">Dar dois minutos</button>`}</div>
        <div class="picks">${active.map(p => `<button class="pick${d.pick === p.i ? ' on' : ''}" data-a="s4pick" data-v="${p.i}" aria-pressed="${d.pick === p.i}">${esc(p.nm)}</button>`).join('')}</div>`
        + acts(btn(d.pick >= 0 ? `Banir ${esc(P[d.pick].nm)}` : 'Escolhe quem banir', 's4ban', {dis: !(d.pick >= 0)}));
    }
    case 'ban': {
      const p = P[d.last], t = p.role === 'T', left = P.filter(x => x.role === 'T' && !x.out).length;
      return tag(`${esc(p.nm)} sai da mesa`) + `<h1 class="title role ${t ? 'bad' : 'ok'}">${t ? 'Traição' : 'Lealdade'}</h1>
        <p class="lead">${t ? (left ? 'Apanhaste uma pessoa. Ainda há outra à mesa.' : 'Era a última pessoa a trair-te.') : `${esc(p.nm)} estava do teu lado. Quem trai continua à mesa.`}</p>`
        + acts(btn(left === 0 || d.round >= 3 ? 'Ver o resultado' : `Ronda ${d.round + 1}`, 's4next'));
    }
    default: {
      const quem = P.filter(x => x.role === 'T' && !x.out).map(x => esc(x.nm)).join(' e ');
      return d.res === 'win'
        ? etapaTag() + `<h1 class="title">Mesa limpa</h1><p class="lead">Ana, baniste toda a gente que te traía.</p>` + acts(btn('Receber a prenda', 'winNow'))
        : etapaTag() + `<h1 class="title">A traição venceu</h1><p class="lead">Continuava à mesa, sem ser apanhado: <strong>${quem}</strong>.</p>` + acts(btn('Continuar', 'failGift'));
    }
  }
}

/* ---------- Etapa 5: cores (resgate dos Warriors) ---------- */
function vCores(){
  const d = S.d;
  if(S.step === 'brief') return etapaTag() + `<h1 class="title">O resgate dos Warriors</h1>
    <p class="lead">A Corrida Final faz-se a contar: três etapas seguidas, e o relógio só pára no tapete do Pit Stop.</p>
    <p class="lead">Primeiro vais buscar o que já era teu. Os bilhetes ficaram em território inimigo, entre seis gangues de seis cores.</p>`
    + rules(['No telemóvel: põe cada cor no seu copo. São seis cores e só há um copo vazio. De reserva tens três dicas e um copo extra.', 'Na sala: atravessa o território inimigo sem tocar no chão, com duas almofadas e 90 segundos.', 'O relógio da corrida não pára entre provas.'])
    + acts(btn('Partida', 'sortGo'));
  if(S.step === 'trav') return parte(2, 2) + `<h1 class="title">A travessia</h1>

/* ---------- Etapa 6: paciência ---------- */
function dealGolf(deal){
  for(;;){
    const order = []; for(let c = 0; c < 6; c++) order.push(c, c, c, c); shuffle(order);
    const tab = [], stock = []; let cur = rnd(13), i = 0; stock.push(cur);
    while(i < 24){
      const len = Math.min(24 - i, 2 + rnd(4));
      for(let k = 0; k < len; k++){ cur = (cur + (Math.random() < .5 ? 1 : 12)) % 13; tab.push(cur); i++; }
      if(i < 24){ cur = rnd(13); stock.push(cur); }
    }
    stock.push(rnd(13));
    const cnt = new Array(13).fill(0);
    if(tab.concat(stock).some(r => ++cnt[r] > 4)) continue;
    const pool = []; for(let r = 0; r < 13; r++) pool.push(shuffle([0,1,2,3]));
    const mk = r => ({r, s: pool[r].pop()});
    const cols = [[],[],[],[],[],[]];
    for(let j = 0; j < 24; j++) cols[order[j]].unshift(mk(tab[j]));
    const st = stock.map(mk);
    return {cols, top: st.shift(), stock: st, won: false, deal};
  }
}
function card(cd, col){
  const cls = 'pc' + (cd.s === 1 || cd.s === 2 ? ' red' : ''), lab = `${RANKS[cd.r]} de ${NAIPES[cd.s]}`;
  const inner = `<span>${RANKS[cd.r]}</span><span class="su">${SUITS[cd.s]}</span>`;
  return col >= 0 ? `<button class="${cls}" data-a="golfCard" data-v="${col}" aria-label="${lab}">${inner}</button>` : `<div class="${cls}" role="img" aria-label="${lab}">${inner}</div>`;
}

      + host('O júri decide se a Ana cumpriu.')

  }
  const stuck = !d.won && !d.stock.length && !d.cols.some(c => c.length && adj(c[c.length - 1].r, d.top.r));

const VIEWS = {1:v1, 2:v2, 3:v3, 4:v4, 5:vCores, 6:vPaciencia, 7:v7};

/* ---------- Transições ---------- */
function win(){
  S.done = Math.max(S.done, S.n); S.screen = 'gift'; S.gstep = 'lock'; S.step = ''; S.d = {};
  if(S.n === 7 && S.t3 && !S.t3end) S.t3end = Date.now();
}
function fail(after){
  S.torches = Math.max(0, S.torches - 1); S.castigo = rnd(CASTIGOS.length); S.after = after; S.screen = 'fail';
}
function startClock(){ if(!S.t3){ S.t3 = Date.now(); S.t3end = 0; } }

const ACT = {
  start(){ S.screen = S.intro ? 'hub' : 'intro'; },
  formato(){ S.screen = 'intro'; },
  introNext(){ S.screen = S.intro ? 'splash' : 'intro2'; },
  introOk(){ S.intro = true; S.screen = 'hub'; },
  hub(){ if(S.screen === 'stage' || S.screen === 'fail' || S.screen === 'gift') S.ret = S.screen; S.screen = 'hub'; },
  home(){ S.screen = 'splash'; S.pinErr = false; S.ask = false; },
  back(){
    switch(S.screen){
      case 'intro2': S.screen = 'intro'; break;
      case 'stage': case 'fail': case 'gift': S.ret = S.screen; S.screen = 'hub'; break;
      case 'extra': case 'album': case 'final': S.screen = 'hub'; break;
      default: S.screen = 'splash'; S.pinErr = false; S.ask = false;
    }
  },
  menu(){ S.menu = !S.menu; },
  menuClose(){ S.menu = false; },
  giftBack(){ if(S.open < S.done){ S.n = S.open + 1; S.gstep = 'lock'; S.screen = 'gift'; } },
  play(){
    const n = S.done + 1;
    if(n > 7){ S.screen = 'final'; return; }
    if(S.ret === 'fail' && S.n === n){ S.ret = ''; S.screen = 'fail'; return; }
    S.ret = '';
    if(S.n !== n || !S.step){ S.n = n; S.step = 'brief'; S.d = {}; }
    S.screen = 'stage';
  },
  winNow(){ win(); },
  failGift(){ fail('gift'); },
  castigoOk(){ if(S.after === 'gift') win(); else { S.screen = 'stage'; S.step = S.after; } },
  giftOpen(){ S.gstep = 'open'; S.open = Math.max(S.open, S.n); },
  giftOk(){ if(S.open < S.done){ S.n = S.open + 1; S.gstep = 'lock'; } else if(S.done >= 7){ S.screen = 'final'; setTimeout(confetti, 60); } else S.screen = 'hub'; },
  extra(v){ const e = EXTRAS.find(x => x.id === v); if(!e || S.open < e.de || S.x[v] === 'n') return false; if(S.xid !== v) S.xd = null; S.xid = v; S.screen = 'extra'; },
  xqGo(){ if(!S.x.xq) S.xd = {i:0, ok:0, tEnd: Date.now() + FAQ_T}; },
  xqAns(v){ const x = S.xd; if(!x) return false; if(FAQ[x.i].a === +v) x.ok++; x.i++; if(x.i >= FAQ.length || Date.now() > x.tEnd) xqEnd(); },
  extraOk(){ const e = EXTRAS.find(x => x.id === S.xid); if(e && !e.quiz && !S.x[S.xid]){ S.x[S.xid] = S.torches < 3 ? 'r' : 'f'; if(S.torches < 3) S.torches++; } },
  album(){ S.screen = 'album'; },
  foto(v){ if(livre(v)){ pend = v; cam.value = ''; cam.click(); } return false; },

  pin(){ S.screen = 'pin'; S.pinErr = false; },
  pinGo(){ const el = document.getElementById('pin'); if(el && el.value === PIN){ S.screen = 'back'; S.pinErr = false; } else S.pinErr = true; },
  jump(v){ const n = +v; S.intro = true; S.ret = ''; S.done = n - 1; S.open = n - 1; S.n = 0; S.step = ''; S.d = {}; if(n <= 5) S.t3 = 0; S.t3end = 0; },
  relight(){ S.torches = 3; },
  resetAsk(){ S.ask = true; }, resetNo(){ S.ask = false; },
  resetYes(){ S = fresh(); S.screen = 'back'; clearFotos(); },

  s1pares(){ const ix = PARES.map((_, i) => i); S.step = 'pares'; S.d = {L: shuffle(ix.slice()), R: shuffle(ix.slice()), selL:-1, selR:-1, ok: ix.map(() => false), bad:false, err:0}; },
  pairTap(v){ const d = S.d, [side, n] = v.split(':'), i = +n; if(d.ok[i] || d.err > PARES_ERROS) return;
    if(side === 'L') d.selL = d.selL === i ? -1 : i; else d.selR = d.selR === i ? -1 : i;
    d.bad = false;
    if(d.selL >= 0 && d.selR >= 0){ if(d.selL === d.selR) d.ok[d.selL] = true; else { d.bad = true; d.err++; } d.selL = d.selR = -1; } },
  s1paresFail(){ S.d = {}; fail('venda'); },
  s1venda(){ S.step = 'venda'; S.d = {}; },
  s1go(){ S.step = 'play'; S.d = {r:[0,0,0,0,0]}; },
  s1mark(v){ const [i, x] = v.split(':').map(Number); S.d.r[i] = x; },
  s1end(){ if(S.d.r.filter(x => x === 1).length >= 4) win(); else fail('gift'); },

  s2regras(){ S.step = 'regras'; S.d = {}; },
  s2sc(){ const tres = t => shuffle(ENCOMENDAS.map((e, i) => e.t === t ? i : -1).filter(i => i >= 0)).slice(0, 3);
    S.step = 'sc'; S.d = {order: shuffle([].concat(tres('A'), tres('P'), tres('S'), tres('E'))), i:0, ok:0, wrong:[], tEnd: Date.now() + TURNO}; },
  s2bin(v){ const d = S.d; if(S.step !== 'sc') return; const k = d.order[d.i];

  s3mem(){ S.step = 'mem'; S.d = {cards: shuffle(MEMO.concat(MEMO).map((_, i) => ({k: i % MEMO.length, up:false, ok:false}))), open:[], moves:0, lock:false}; },
  memTap(v){ const d = S.d, i = +v, c = d.cards[i]; if(d.lock || c.up || c.ok || d.moves >= MEM_MAX) return false;

    if(d.open.length === 2){
      const [a, b] = d.open; d.moves++;
      if(d.cards[a].k === d.cards[b].k){ d.cards[a].ok = d.cards[b].ok = true; d.cards[a].up = d.cards[b].up = false; d.open = []; }
      else { d.lock = true; setTimeout(() => { if(S.screen === 'stage' && S.n === 3 && S.step === 'mem' && S.d.lock){ S.d.cards[a].up = S.d.cards[b].up = false; S.d.open = []; S.d.lock = false; render(); } }, 800); }
    } },
  s3memFail(){ S.d = {q:0, score:0, ans:null}; fail('quiz'); },
  s3go(){ S.step = 'quiz'; S.d = {q:0, score:0, ans:null}; },
  s3ans(v){ const d = S.d; if(d.ans !== null) return; d.ans = +v; if(d.ans === QUIZ[d.q].a) d.score++; },
  s3live(v){ const d = S.d; if(d.ans !== null) return; d.ans = v; if(v === 'ok') d.score++; },
  s3next(){ const d = S.d; if(d.ans === null) return; if(d.q >= QUIZ.length - 1) S.step = 'quizres'; else { d.q++; d.ans = null; } },
  s3res(){ const pass = S.d.score >= QUIZ_MIN; S.d = {f:[0,0,0], tEnd:0}; if(pass) S.step = 'fotos'; else fail('fotos'); },
  s3timer(){ S.d.tEnd = Date.now() + 300000; },
  s3foto(v){ S.d.f[+v] = S.d.f[+v] ? 0 : 1; },

  s4go(){ if(ONLINE){ S.step = 'lobby'; S.d = {mode:'on'}; } else { S.step = 'nomes'; S.d = {names:['','','','',''], err:''}; } },
  s4local(){ S.step = 'nomes'; S.d = {names:['','','','',''], err:''}; },
  s4kick(v){ delete MESA.jog[v]; net.del('in/jog/' + v); },
  s4close(){ fechaVotos(true); },
  s4add(){ if(S.d.names.length < 12) S.d.names.push(''); },
  s4del(v){ if(S.d.names.length > 4) S.d.names.splice(+v, 1); },
  s4deal(){
    if(S.d.mode === 'on'){
      const J = Object.keys(MESA.jog).map(id => ({id, nm: MESA.jog[id].nm, t: MESA.jog[id].t || 0})).sort((a, b) => a.t - b.t);
      if(J.length < 4) return;
      const nT = J.length >= 6 ? 2 : 1, trai = shuffle(J.map((_, i) => i)).slice(0, nT), papeis = {};
      J.forEach((j, i) => { papeis[j.id] = {r: trai.includes(i) ? 'T' : 'F', com: trai.includes(i) ? trai.filter(k => k !== i).map(k => J[k].nm) : []}; });
      S.d = {mode:'on', players: J.map((j, i) => ({id: j.id, nm: j.nm, role: trai.includes(i) ? 'T' : 'F', out:false})), idx:0, shown:false, round:1, log:[], team:[], vi:0, sab:0, pick:-1, tEnd:0, last:-1, res:''};
      MESA.voto = {}; net.put('mesa/papel', papeis); net.del('in/voto');
      S.step = 'pronto'; return;
    }
    const d = S.d, names = d.names.map(x => x.trim()).filter(Boolean);
    if(names.length < 4){ d.err = 'São precisos pelo menos 4 jogadores além da Ana.'; return; }
    const nT = names.length >= 6 ? 2 : 1, idx = shuffle(names.map((_, i) => i)).slice(0, nT);
    S.d = {players: names.map((nm, i) => ({nm, role: idx.includes(i) ? 'T' : 'F', out:false})), idx:0, shown:false, round:1, log:[], team:[], vi:0, sab:0, pick:-1, tEnd:0, last:-1, res:''};
    S.step = 'papeis';
  },
  s4show(){ S.d.shown = true; },
  s4hide(){ const d = S.d; d.shown = false; d.idx++; if(d.idx >= d.players.length) S.step = 'pronto'; },
  s4begin(){ S.step = 'missao'; },
  s4m(v){ const d = S.d; d.log.push(v === '1'); d.pick = -1; d.tEnd = 0; S.step = 'mesa'; },
  s4team(){ S.d.team = []; S.step = 'equipa'; },
  s4tog(v){ const d = S.d, i = +v, at = d.team.indexOf(i), k = Math.min(3, d.players.filter(p => !p.out).length); if(at >= 0) d.team.splice(at, 1); else if(d.team.length < k) d.team.push(i); },
  s4vote0(){ const d = S.d; d.vi = 0; d.sab = 0; d.shown = false; if(d.mode === 'on'){ d.vid = Math.random().toString(36).slice(2, 8); MESA.voto = {}; net.del('in/voto'); } S.step = 'voto'; },
  s4vshow(){ S.d.shown = true; },
  s4v(v){ const d = S.d, p = d.players[d.team[d.vi]]; if(v === 's' && p.role === 'T') d.sab++; d.vi++; d.shown = false; if(d.vi >= d.team.length){ d.vi = 0; d.log.push(d.sab === 0); S.step = 'mres'; } },
  s4mesa(){ const d = S.d; d.pick = -1; d.tEnd = 0; S.step = 'mesa'; },
  s4timer(){ S.d.tEnd = Date.now() + 120000; },
  s4pick(v){ S.d.pick = +v; },
  s4ban(){ const d = S.d; if(d.pick < 0) return; d.players[d.pick].out = true; d.last = d.pick; d.pick = -1; S.step = 'ban'; },
  s4next(){ const d = S.d, left = d.players.filter(p => p.role === 'T' && !p.out).length;
    if(left === 0){ d.res = 'win'; S.step = 'fim'; } else if(d.round >= 3){ d.res = 'lose'; S.step = 'fim'; } else { d.round++; S.step = 'missao'; } },

  sortGo(){ startClock(); const o = S.step === 'play' && S.d && S.d.tubes ? S.d : null;
    S.step = 'play'; S.d = {tubes: NIVEL.map(t => t.slice()).concat(o && o.extra ? [[]] : []), sel:-1, hist:[], moves:0, won:false, dicas: o ? o.dicas : 3, extra: !!(o && o.extra), hint:null, msg:''}; },
  sortT(v){ const d = S.d, i = +v; if(d.won) return;
    if(d.sel < 0){ if(d.tubes[i].length) d.sel = i; return; }
    if(d.sel === i){ d.sel = -1; return; }
    const A = d.tubes[d.sel], B = d.tubes[i], c = A[A.length - 1];
    if(B.length < 4 && (!B.length || B[B.length - 1] === c)){
      B.push(A.pop()); d.hist.push([d.sel, i]); d.moves++; d.sel = -1; d.hint = null; d.msg = '';
      d.won = d.tubes.every(t => !t.length || (t.length === 4 && t.every(x => x === t[0])));
    } else d.sel = B.length ? i : -1; },
  sortHint(){ const d = S.d; if(d.won || d.hint || d.dicas <= 0) return;
    const h = dica(d.tubes);
    if(h.r === 'ok'){ d.hint = h.move; d.dicas--; d.msg = ''; d.sel = -1; }
    else d.msg = h.r === 'none' ? 'Este caminho não tem saída. Anula jogadas ou recomeça.' : 'Não encontrei uma dica a tempo. Anula umas jogadas e tenta outra vez.'; },
  sortExtra(){ const d = S.d; if(d.extra || d.won) return; d.extra = true; d.tubes.push([]); d.hint = null; d.msg = ''; d.sel = -1; },
  sortDone(){ S.step = 'trav'; S.d = {tEnd:0}; },
  s5timer(){ S.d.tEnd = Date.now() + 90000; },
  sortUndo(){ const d = S.d, m = d.hist.pop(); if(m){ d.tubes[m[0]].push(d.tubes[m[1]].pop()); d.moves--; d.sel = -1; d.hint = null; d.msg = ''; } },

  luzGo(){ startClock(); luzReset(); S.step = 'luz'; S.d = {tries:[]}; },
  luzOk(){ S.step = 'play'; S.d = dealGolf(1); },
  luzFail(){ S.d = dealGolf(1); fail('play'); },
  golfGo(){ startClock(); S.step = 'play'; S.d = dealGolf(1); },
  golfNew(){ const n = (S.d.deal || 1) + 1; if(n <= GOLF_DEALS && !S.d.won) S.d = dealGolf(n); },
  golfDone(){ S.step = 'desvio'; S.d = {}; },
  golfFail(){ S.d = {}; fail('desvio'); },
  s6pick(v){ if(DESVIO[v]){ S.step = 'desvioGo'; S.d = {pick: v, tEnd: 0}; } },
  s6timer(){ S.d.tEnd = Date.now() + DESVIO[S.d.pick].s * 1000; },
  golfDraw(){ const d = S.d; if(d.stock.length && !d.won) d.top = d.stock.shift(); },
  golfCard(v, el){ const d = S.d, col = d.cols[+v]; if(!col.length || d.won) return false;
    if(adj(col[col.length - 1].r, d.top.r)){ d.top = col.pop(); d.won = d.cols.every(c => !c.length); return true; }
    el.classList.remove('no'); void el.offsetWidth; el.classList.add('no'); return false; },

  s7go(){ startClock(); S.step = 'l1'; S.d = lesson(0, 3); },
  s7tile(v){ const d = S.d, j = +v; if(d.fb === 'ok' || d.h <= 0 || d.pick.includes(j)) return; d.pick.push(j); d.fb = ''; },
  s7un(v){ const d = S.d; if(d.fb === 'ok' || d.h <= 0) return; d.pick.splice(+v, 1); d.fb = ''; },
  s7check(){ const d = S.d; if(d.pick.map(j => d.bank[j]).join(' ') === LICOES[d.li].resp.join(' ')) d.fb = 'ok'; else { d.fb = 'bad'; d.h--; } },
  s7dead(){ const li = S.d.li; S.d = lesson(li, 3); fail('l' + (li + 1)); },
  s7next(){ const li = S.d.li, h = S.d.h; if(li === 0){ S.step = 'c1'; S.d = {code:'', err:false, h}; } else if(li === 1){ S.step = 'c2'; S.d = {code:'', err:false, h}; } else { S.step = 'tapete'; S.d = {}; } },
  s7code(){ const el = document.getElementById('code'); const v = (el ? el.value : S.d.code || '').replace(/\D/g, ''), h = S.d.h || 3;
    if(v === CODIGOS[S.step]){ if(S.step === 'c1'){ S.step = 'l2'; S.d = lesson(1, h); } else { S.step = 'l3'; S.d = lesson(2, h); } }
    else { S.d.code = v; S.d.err = true; } }
};

/* Com a app de gestão ligada, as decisões do júri ficam trancadas no telemóvel da Ana. */
const JUIZ = new Set(['s1mark', 's1end', 's2shot', 's3live', 's3foto', 's4m', 'castigoOk', 'extraOk']);
const juiz = a => JUIZ.has(a) || ((a === 'winNow' || a === 'failGift') && S.screen === 'stage' && ((S.n === 5 && S.step === 'trav') || (S.n === 6 && S.step === 'desvioGo') || (S.n === 7 && S.step === 'tapete')));
function tranca(){
  if(!hostOn()) return;
  let n = 0;
  app.querySelectorAll('[data-a]').forEach(el => { if(juiz(el.dataset.a)){ el.classList.add('lock'); el.setAttribute('aria-disabled', 'true'); el.tabIndex = -1; n++; } });
  if(!n || (S.screen === 'stage' && S.n === 1 && S.step === 'play')) return;
  const nota = document.createElement('p'); nota.className = 'muted small juiz'; nota.textContent = 'O apresentador valida no telemóvel dele.';
  const a = app.querySelector('.actions'); if(a) a.parentNode.insertBefore(nota, a); else app.appendChild(nota);
}

/* ---------- Comandos do apresentador (executados no telemóvel da Ana) ---------- */
const ADMIN = new Set(['jump', 'relight', 'resetYes']);
function runCmd(c){
  if(!c || !ACT[c.a]) return;
  const v = c.v === undefined || c.v === null ? '' : String(c.v);
  if(ADMIN.has(c.a)){
    ACT[c.a](v);
    if(c.a === 'jump') S.screen = 'hub';
    if(c.a === 'resetYes') S.screen = 'splash';
    S.menu = false; render(); return;
  }
  /* Só vale o que está mesmo no ecrã dela neste momento. */
  const el = [...app.querySelectorAll('[data-a]')].find(x => x.dataset.a === c.a && (x.dataset.v === undefined ? '' : x.dataset.v) === v);
  if(!el || el.disabled) return;
  S.menu = false;
  if(ACT[c.a](v === '' ? undefined : v, el) !== false) render();
}
function ligaJogo(){
  if(!ONLINE || LIG.on) return; LIG.on = true;
  try{ LIG.cmd = localStorage.getItem(KEY + '-cmd') || ''; }catch(e){}
  watch('in', (all, path) => {
    all = all || {};
    let again = false;
    /* Apresentador: o primeiro retrato de cada ligação só conta se for recente; daí em diante, cada sinal é ao vivo. */
    const h = all.host && all.host.t;
    if(h && h !== LIG.hostT){ LIG.hostT = h; if(path !== '/' || Math.abs(Date.now() - h) < 30000) LIG.host = Date.now(); }
    if(LIG.was !== hostOn()){ LIG.was = hostOn(); again = true; }
    const jog = JSON.stringify(all.jog || {}), voto = JSON.stringify(all.voto || {});
    if(jog !== LIG.jog){ LIG.jog = jog; MESA.jog = JSON.parse(jog); if(S.screen === 'stage' && S.n === 4 && S.step === 'lobby') again = true; }
    if(voto !== LIG.voto){ LIG.voto = voto; MESA.voto = JSON.parse(voto); if(fechaVotos(false)) again = true; }
    const cmds = all.cmd || {};
    Object.keys(cmds).sort().forEach(k => {
      const novo = k > LIG.cmd;
      if(novo){ LIG.cmd = k; try{ localStorage.setItem(KEY + '-cmd', k); }catch(e){} }
      /* Toques que ficaram em fila enquanto este telemóvel esteve sem rede são antigos: deitam-se fora. */
      if(novo && path !== '/'){ runCmd(cmds[k]); again = false; }
      if(novo || path === '/') net.del('in/cmd/' + k);
    });
    if(again) render();
  });
  net.put('vivo', {t: Date.now()});
  AOVOLTAR.push(() => { net.put('vivo', {t: Date.now()}); LIG.pub = ''; publish(); });
  setInterval(() => { net.put('vivo', {t: Date.now()}); if(LIG.was !== hostOn()){ LIG.was = hostOn(); render(); } }, 8000);
}

function ligaGerir(){
  if(GL.on || !ONLINE) return; GL.on = true;
  watch('', (all, path) => {

    ${ML.err ? fbx('bad', ML.err) : ''}` + acts(`<button class="btn" data-m="join"${ML.pend ? ' disabled' : ''}>${ML.pend ? 'A entrar…' : 'Entrar'}</button>`);
  else if(!pb || pb.fase === 'lobby' || !pb.jog) h += tag('Inscrição feita') + `<h1 class="title">Estás à mesa, ${esc(Mz.nm)}</h1>
    <p class="lead">Quando a Ana distribuir os papéis, o teu aparece aqui. Deixa esta página aberta.</p>` + acts(`<button class="btn alt small" data-m="sair">Mudar o nome</button>`);
  else if(!eu) h += tag('Jogo a decorrer') + `<h1 class="title">Ficaste de fora</h1>
    <p class="lead">Os papéis já estavam distribuídos quando entraste. Podes assistir, mas não jogas esta partida.</p>`;
  else {
    const T = ML.papel && ML.papel.r === 'T', com = (ML.papel && ML.papel.com) || [], M = MISSOES[Math.min(3, Math.max(1, pb.ronda || 1)) - 1];
    h += `<div class="papel"><b class="lbl">O teu papel</b>${ML.show && ML.papel ? `<b class="w ${T ? 'tbad' : ''}" style="${T ? '' : 'color:var(--ok)'}">${T ? 'Traição' : 'Lealdade'}</b><span>${T ? 'Estás contra a Ana. Sabota as missões sem dar nas vistas e não te deixes banir.' + (com.length ? ' Trai contigo: ' + com.map(esc).join(', ') + '.' : '') : 'Estás do lado da Ana. Cumpre as missões e ajuda-a a descobrir quem trai.'}</span>` : `<span class="muted">Escondido. Vê-o sem ninguém ao lado.</span>`}<button class="mini" data-m="papel">${ML.show ? 'Esconder' : 'Ver o meu papel'}</button></div>`;
    if(eu.out) h += fbx('bad', 'Saíste da mesa. Podes assistir, mas já não votas nem vais em missões.');
    const nomes = (pb.equipa || []).map(id => (pb.jog.find(j => j.id === id) || {}).nm).filter(Boolean).map(esc).join(', ');
    const okM = pb.log && pb.log.length ? pb.log[pb.log.length - 1] : true;
    switch(pb.fase){
      case 'pronto': h += tag('Antes da ronda 1') + `<h1 class="title">Papéis entregues</h1><p class="lead">Vê o teu em segredo. O jogo começa quando a Ana der o sinal.</p>`; break;
      case 'missao': h += tag(`Ronda ${pb.ronda} de 3 · Missão`) + `<h1 class="title">${M.t}</h1>` + rules(M.r) + `<p class="muted small" style="padding:0 4px">${M.nota}</p>`; break;
      case 'equipa': h += tag('Ronda 3 · Equipa') + `<h1 class="title">A Ana escolhe a equipa</h1><p class="lead">Quem for escolhido vota em segredo no seu telemóvel.</p>`; break;
      case 'voto':
        if((pb.equipa || []).includes(Mz.pid) && !eu.out){
          h += Mz.vk === votoKey(pb) ? tag('Ronda 3 · Voto secreto') + `<h1 class="title">Voto entregue</h1><p class="lead">À espera do resto da equipa.</p>`
            : tag('Ronda 3 · Voto secreto') + `<h1 class="title">O teu voto</h1><p class="lead">Foste para a missão. Ninguém vê o que escolhes.</p><p class="muted small" style="padding:0 4px">Se fores fiel, o teu voto conta sempre como cumprir, carregues onde carregares.</p>`
              + (ML.err ? fbx('bad', ML.err) : '') + acts(`<button class="btn alt" data-m="voto:c"${ML.pend ? ' disabled' : ''}>Cumprir a missão</button><button class="btn alt" data-m="voto:s"${ML.pend ? ' disabled' : ''}>Sabotar a missão</button>`);
        } else h += tag('Ronda 3 · Voto secreto') + `<h1 class="title">A equipa está a votar</h1><p class="lead">Na missão: ${nomes}.</p>`;
        break;
      case 'mres': h += tag('Ronda 3 · Missão') + `<h1 class="title role ${pb.sab ? 'bad' : 'ok'}">${pb.sab ? 'Sabotada' : 'Cumprida'}</h1><p class="lead">Votos de sabotagem: <strong>${Math.max(0, pb.sab)}</strong>.</p>`; break;
      case 'mesa': h += tag(`Ronda ${pb.ronda} de 3 · Mesa Redonda`) + `<h1 class="title">Quem trai a Ana?</h1><p class="lead">A missão ${okM ? 'foi cumprida' : 'falhou'}. Discutam. Depois a Ana bane uma pessoa.</p>${pb.tEnd ? `<div class="timer"><span class="clock big" id="mz-clock">${fmt(pb.tEnd - Date.now())}</span></div>` : ''}`; break;
      case 'ban': h += pb.last ? tag(`${esc(pb.last.nm)} sai da mesa`) + `<h1 class="title role ${pb.last.t ? 'bad' : 'ok'}">${pb.last.t ? 'Traição' : 'Lealdade'}</h1><p class="lead">${pb.last.t ? 'A Ana apanhou uma pessoa que a traía.' : 'A Ana baniu uma pessoa fiel.'}</p>` : ''; break;
      case 'fim': h += pb.res === 'win' ? tag('Fim do jogo') + `<h1 class="title">Mesa limpa</h1><p class="lead">A Ana baniu toda a gente que a traía.</p>`
        : tag('Fim do jogo') + `<h1 class="title">A traição venceu</h1><p class="lead">Ficou por apanhar: <strong>${(pb.quem || []).map(esc).join(' e ')}</strong>.</p>`; break;
      default: h += `<h1 class="title">Mesa Redonda</h1><p class="lead">O jogo continua no telemóvel da Ana.</p>`;
    }
  }
  app.innerHTML = h;
}
function clickM(e){
  const m = e.target.closest('[data-m]'); if(!m) return;
  const [k, v] = m.dataset.m.split(':');
  if(k === 'join'){
    const el = document.getElementById('mnome'), nm = (el ? el.value : ML.typing).trim().slice(0, 18);
    if(!nm){ ML.err = 'Escreve o teu nome primeiro.'; }
    else {
      ML.pend = true; ML.err = ''; ML.typing = nm;
      net.put('in/jog/' + Mz.pid, {nm, t: Date.now()}).then(r => {
        ML.pend = false;
        if(r && r.ok){ Mz.nm = nm; Mz.dentro = true; saveM(); } else ML.err = 'Não deu para entrar. Vê se tens rede e tenta outra vez.';
        renderM();
      });
    }
  }
  else if(k === 'sair'){ Mz.dentro = false; ML.typing = Mz.nm; saveM(); ML.pend = true; net.del('in/jog/' + Mz.pid).then(() => { ML.pend = false; }); }
  else if(k === 'papel') ML.show = !ML.show;
  else if(k === 'voto' && ML.pub && !ML.pend){
    const chave = votoKey(ML.pub);
    ML.pend = true; ML.err = '';
    net.put('in/voto/' + Mz.pid, v === 's' ? 's' : 'c').then(r => {
      ML.pend = false;
      if(r && r.ok){ Mz.vk = chave; saveM(); } else ML.err = 'O voto não seguiu. Vê se tens rede e tenta outra vez.';
      renderM();
    });
  }
  renderM();
}

/* ---------- Desenho ---------- */
let lastKey = '';
function ecra(){
  let html, fase = '';
  const n = Math.min(7, Math.max(1, S.n || 1));
  switch(S.screen){
    case 'intro': html = vIntro(); break;
    case 'intro2': html = vIntro2(); break;
    case 'hub': html = vHub(); fase = ETAPAS[Math.min(6, S.done)].f; break;
    case 'stage': html = bar() + VIEWS[n](); fase = ETAPAS[n - 1].f; break;
    case 'fail': html = vFail(); fase = ETAPAS[n - 1].f; break;
    case 'gift': html = vGift(); fase = ETAPAS[n - 1].f; break;
    case 'extra': html = vExtra(); fase = ETAPAS[Math.min(6, S.done)].f; break;
    case 'album': html = vAlbum(); fase = ETAPAS[Math.min(6, S.done)].f; break;
    case 'final': html = vFinal(); fase = 3; break;
    case 'pin': html = vPin(); break;
    case 'back': html = vBack(); break;
    default: html = vSplash();
  }
  return [html, fase];
}
function render(){
  if(APP === 'gerir') return renderG();
  if(APP === 'mesa') return renderM();
  const [html, fase] = ecra();
  if(!(S.screen === 'stage' && S.n === 6 && S.step === 'luz')) luzReset();
  document.documentElement.dataset.fase = fase;
  app.innerHTML = html + (S.menu ? vMenu() : '');
  tranca();
  luzPaint();
  const d = S.d || {};
  const key = [S.screen, S.n, S.step, S.gstep, S.xid, d.q, d.idx, d.vi, d.round, d.li, d.shown].join('|');
  if(key !== lastKey){ window.scrollTo(0, 0); lastKey = key; }
  else if(!S.menu){
    /* Actualização no mesmo ecrã: garantir que o aviso e o botão seguinte ficam à vista. */
    const fb = app.querySelector('.fb');
    if(fb) (app.querySelector('.actions') || fb).scrollIntoView({block:'nearest'});
  }
  save();
  publish();
}

document.addEventListener('click', e => {
  if(APP === 'gerir') return clickG(e);
  if(APP === 'mesa') return clickM(e);
  const el = e.target.closest('[data-a]');
  if(!el || el.disabled || el.classList.contains('lock') || !ACT[el.dataset.a]) return;
  if(el.dataset.a !== 'menu') S.menu = false;
  if(ACT[el.dataset.a](el.dataset.v, el) !== false) render();
});
document.addEventListener('pointerdown', e => { if(APP === 'jogo' && e.target.closest && e.target.closest('[data-p="luz"]')) luzPress(); });
document.addEventListener('input', e => {
  const t = e.target, b = t.dataset && t.dataset.bind;
  if(t.id === 'mnome') ML.typing = t.value;
  if(!b || APP !== 'jogo') return;
  if(b === 'name' && S.d.names) S.d.names[+t.dataset.i] = t.value;
  else if(b === 'code'){ t.value = t.value.replace(/\D/g, '').slice(0, 2); S.d.code = t.value; }
  save();
});
document.addEventListener('keydown', e => {
  if(e.key !== 'Enter' || !e.target.dataset) return;
  if(e.target.dataset.genter || e.target.dataset.menter){ e.preventDefault(); const b = app.querySelector('.actions .btn'); if(b) b.click(); return; }
  const a = APP === 'jogo' && e.target.dataset.enter;
  if(a && ACT[a]){ e.preventDefault(); ACT[a](); render(); }
});
setInterval(() => {
  const c = document.getElementById('clock');
  if(c && S.t3 && !S.t3end) c.textContent = fmt(Date.now() - S.t3);
  const m = document.getElementById('mesa-clock');
  if(m && S.d && S.d.tEnd){ const left = S.d.tEnd - Date.now(); m.textContent = fmt(left); m.classList.toggle('over', left <= 0); }
  const mz = document.getElementById('mz-clock');
  if(mz && ML.pub && ML.pub.tEnd){ const left = ML.pub.tEnd - Date.now(); mz.textContent = fmt(left); mz.classList.toggle('over', left <= 0); }
  if(APP === 'gerir'){
    const sc = document.getElementById('sc-clock'), xq = document.getElementById('xq-clock');
    if(sc && S.d && S.d.tEnd) sc.textContent = fmt(Math.max(0, S.d.tEnd - Date.now()) + 999);
    if(xq && S.xd && S.xd.tEnd) xq.textContent = fmt(Math.max(0, S.xd.tEnd - Date.now()) + 999);
  }
  if(APP !== 'jogo') return;
  if(S.screen === 'extra' && S.xd && S.xd.tEnd){
    const left = S.xd.tEnd - Date.now(), el = document.getElementById('xq-clock');
    if(left <= 0){ xqEnd(); render(); } else if(el) el.textContent = fmt(left + 999);
  }
  if(S.screen === 'stage' && S.n === 2 && S.step === 'sc' && S.d.tEnd){
    const left = S.d.tEnd - Date.now(), sc = document.getElementById('sc-clock');
    if(left <= 0){ S.d.tEnd = 0; S.step = 'scres'; render(); }
    else if(sc) sc.textContent = fmt(left + 999);
  }
}, 500);

function confetti(){
  if(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const cv = document.createElement('canvas'); cv.className = 'confetti'; document.body.appendChild(cv);
  const ctx = cv.getContext('2d'), W = cv.width = innerWidth, H = cv.height = innerHeight;
  const cs = getComputedStyle(document.documentElement), cols = ['--g1','--g2','--g3','--c2','--c3'].map(k => cs.getPropertyValue(k).trim() || '#888');
  const P = []; for(let i = 0; i < 130; i++) P.push({x: Math.random() * W, y: -Math.random() * H * .7, vx: (Math.random() - .5) * 2, vy: 2 + Math.random() * 3.5, s: 5 + Math.random() * 7, r: Math.random() * 6.28, vr: (Math.random() - .5) * .3, c: cols[i % cols.length]});
  const t0 = performance.now();
  (function frame(t){
    ctx.clearRect(0, 0, W, H);
    P.forEach(p => { p.x += p.vx; p.y += p.vy; p.r += p.vr; ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c; ctx.beginPath(); ctx.roundRect(-p.s / 2, -p.s / 4, p.s, p.s / 2, 2); ctx.fill(); ctx.restore(); });
    if(t - t0 < 5200) requestAnimationFrame(frame); else cv.remove();
  })(t0);
}

/* ---------- Arranque ---------- */
function boot(data){
  if(APP === 'gerir'){ if(G.ok) ligaGerir(); return renderG(); }
  if(APP === 'mesa'){ ligaMesa(); return renderM(); }
  const o = data && data.v === 3 ? data : load();
  if(o) S = Object.assign(fresh(), o);
  if(S.screen === 'pin' || S.screen === 'back' || S.screen === 'intro' || S.screen === 'intro2') S.screen = 'splash';
  if(S.d && S.d.lock && S.d.cards){ S.d.open.forEach(i => { S.d.cards[i].up = false; }); S.d.open = []; S.d.lock = false; }
  S.ask = false; S.pinErr = false;
  S.menu = false;
  if(S.step === 'luz' && S.d && !S.d.tries) S.d = {tries:[]};
  render();
  loadFotos().then(() => { if(Object.keys(FOTO).length) render(); });
  ligaJogo();
}
document.title = META[0];
(document.querySelector('meta[name="apple-mobile-web-app-title"]') || {}).content = META[1];
/* Fora do Claude (alojada num endereço próprio) a página instala-se como app. */
try{
  if(window.top === window.self && (location.protocol === 'https:' || location.hostname === 'localhost')){
    const link = (rel, href) => { const l = document.createElement('link'); l.rel = rel; l.href = href; document.head.appendChild(l); };
    link('manifest', `manifest${META[2]}.webmanifest`); link('apple-touch-icon', `apple-touch-icon${META[2]}.png`); link('icon', `icon${META[2]}-192.png`);
    if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
  }
}catch(e){}
const hot = window.claude && window.claude.hot;
if(hot && hot.snapshot && APP === 'jogo') hot.snapshot(() => S);
if(hot && hot.ready) hot.ready(boot); else boot((hot && hot.data) || {});
})();
</script>
